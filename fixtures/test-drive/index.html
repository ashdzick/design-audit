<!doctype html>
<!-- Synthetic test fixture for Design Audit. Not a real product, dealership
     or customer. Issues are planted on purpose: see planted.json. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a test drive · Northgate Auto Group</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1d2433; background: #f3f5f9; }
  header.top { display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 20px; background: #14233c; color: #fff; }
  header.top .brand { font-weight: 650; letter-spacing: .2px; }
  header.top nav a { color: #c9d4e8; text-decoration: none; margin-right: 18px; font-size: 13px; }
  header.top nav a[aria-current] { color: #fff; }
  .shell { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 52px); }
  aside.leads { background: #fff; border-right: 1px solid #e1e6ef; padding: 16px 0; }
  aside.leads h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: #4a5568; margin: 0 16px 8px; }
  .search { display: block; width: calc(100% - 32px); margin: 0 16px 10px; border: 1px solid #d5dbe6; border-radius: 8px; padding: 6px 10px; font: inherit; }
  aside.leads ul { list-style: none; margin: 0; padding: 0; }
  aside.leads li a { display: flex; align-items: center; gap: 10px; padding: 9px 16px; color: #1d2433; text-decoration: none; }
  aside.leads li a[aria-current] { background: #eef3fb; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .hot { background: #d93025; } .warm { background: #f29900; } .cold { background: #1a73e8; }
  main { padding: 24px 28px; }
  .lead-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; background: #fff; border: 1px solid #e1e6ef; border-radius: 10px; padding: 18px 20px; }
  .lead-head h1 { font-size: 22px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .meta { color: #a3a9b4; font-size: 13px; }
  .actions { display: flex; gap: 8px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 8px; border: 1px solid #d5dbe6; background: #fff; display: grid; place-items: center; cursor: pointer; color: #14233c; }
  .icon-btn:hover { background: #eef3fb; }
  .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-top: 16px; }
  .card { background: #fff; border: 1px solid #e1e6ef; border-radius: 10px; padding: 16px 20px; }
  .card h2, .card h4 { font-size: 15px; margin: 0 0 12px; }
  .vehicle { display: flex; gap: 14px; align-items: center; }
  .vehicle img { width: 150px; height: 90px; border-radius: 6px; object-fit: cover; background: #dfe5ee; }
  .vehicle a { color: #1a5fb4; }
  .status-row { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .pill { background: #e8f0fe; color: #174ea6; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
  ol.timeline { list-style: none; margin: 0; padding: 0; }
  ol.timeline li { padding: 8px 0; border-top: 1px solid #eef1f6; }
  ol.timeline li:first-child { border-top: 0; }
  ol.timeline time { display: block; color: #a3a9b4; font-size: 12px; }
  textarea { width: 100%; min-height: 84px; border: 1px solid #d5dbe6; border-radius: 8px; padding: 8px 10px; font: inherit; }
  .save { margin-top: 8px; background: #1a5fb4; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .toggle { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: #1a5fb4; cursor: pointer; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  select { border: 1px solid #d5dbe6; border-radius: 8px; padding: 6px 8px; font: inherit; }
  footer { padding: 12px 28px; color: #4a5568; font-size: 12px; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e1e6ef; border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid #eef1f6; }
  th { font-size: 12px; color: #4a5568; background: #f8fafc; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .toolbar h1 { font-size: 20px; margin: 0 auto 0 0; }
  .muted { color: #a3a9b4; font-size: 12.5px; }
  .row-actions { display: flex; gap: 6px; }
  .row-actions .icon-btn { width: 32px; height: 32px; }
  .form { max-width: 640px; background: #fff; border: 1px solid #e1e6ef; border-radius: 10px; padding: 22px 24px; }
  .form h1 { font-size: 20px; margin: 0 0 4px; }
  .field { margin-top: 14px; }
  .field input, .field select { width: 100%; border: 1px solid #d5dbe6; border-radius: 8px; padding: 8px 10px; font: inherit; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .req { color: #d93025; }
  .err { color: #f08a7e; font-size: 12px; margin-top: 4px; }
  .cal { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<header class="top">
  <span class="brand">Northgate Auto Group</span>
  <nav aria-label="Primary">
    <a href="#" aria-current="page">Leads</a>
    <a href="#">Customers</a>
    <a href="#">Inventory</a>
    <a href="#">Reports</a>
  </nav>
</header>
<main style="padding:24px 28px">
  <form class="form" onsubmit="return false">
    <h1>Book a test drive</h1>
    <p class="muted">For Dana Whitfield · 2025 Ridgeline Crossover SE</p>
    <div class="pair">
      <div class="field"><label for="first">First name <span class="req">*</span></label><input id="first" value="Dana"></div>
      <div class="field"><label for="last">Last name <span class="req">*</span></label><input id="last" value="Whitfield"></div>
    </div>
    <div class="field">
      <label for="email">Email <span class="req">*</span></label>
      <!-- PLANTED: invalid autocomplete value (autocomplete-valid) -->
      <input id="email" type="email" autocomplete="nope" value="dana.w@">
      <!-- PLANTED: error text too low-contrast (color-contrast); error tied to color, not text (part 2) -->
      <div class="err">Check this field</div>
    </div>
    <div class="field">
      <label>Preferred date</label>
      <div class="cal">
        <!-- PLANTED: date field whose label isn't tied to it (label); icon-only calendar button (button-name) -->
        <input type="text" placeholder="MM/DD/YYYY">
        <button class="icon-btn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>
      </div>
    </div>
    <div class="field">
      <label for="time">Time</label>
      <select id="time"><option>10:00 AM</option><option>1:00 PM</option><option>4:30 PM</option></select>
    </div>
    <button class="save" style="margin-top:18px">Book test drive</button>
  </form>
</main>
<footer>Synthetic demo page for testing Design Audit. Not a real product, dealership or customer.</footer>
</body>
</html>
